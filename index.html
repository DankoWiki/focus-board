<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Focus Board</title>
<meta name="description" content="A private, offline personal Kanban board.">
<meta name="theme-color" content="#E3E9E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A21" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: app shell — a desk rail on the side, a graph-paper board canvas, tasks as index cards */
:root {
  --paper: #EDF1EE;
  --surface: #FFFFFF;
  --surface-2: #E3E9E5;
  --surface-3: #D6DED9;
  --ink: #17202A;
  --ink-2: #4B5765;
  --ink-3: #75808C;
  --line: #CBD4CF;
  --line-2: #B5C0BA;
  --accent: #2C47C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE3FA;
  --accent-text: #2840B8;
  --crit: #BF3329;
  --high: #AD5E08;
  --ok: #1F7A4B;
  --grid: rgba(44, 71, 201, .065);
  --shadow: 0 1px 0 rgba(23, 32, 42, .05), 0 1px 3px rgba(23, 32, 42, .07);
  --shadow-lg: 0 14px 36px rgba(23, 32, 42, .2), 0 2px 6px rgba(23, 32, 42, .08);
  --scrim: rgba(16, 22, 30, .4);
  --f-display: "Rubik", "IBM Plex Sans Hebrew", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Hebrew", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-card: 8px;
  --r-col: 12px;
  --col-w: 288px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-fb-theme="light"]) {
    --paper: #0F141A; --surface: #1A2129; --surface-2: #141A21; --surface-3: #222B35;
    --ink: #E2E7ED; --ink-2: #A2ADBA; --ink-3: #75818D; --line: #28313B; --line-2: #36414D;
    --accent: #8398FF; --accent-ink: #0D1431; --accent-soft: #212A4E; --accent-text: #A3B2FF;
    --crit: #FF6F64; --high: #EFA23B; --ok: #4CC184;
    --grid: rgba(131, 152, 255, .05);
    --shadow: 0 1px 0 rgba(0, 0, 0, .35); --shadow-lg: 0 18px 44px rgba(0, 0, 0, .55);
    --scrim: rgba(0, 0, 0, .58);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-fb-theme="light"]), :root[data-fb-theme="dark"] {
  --paper: #0F141A; --surface: #1A2129; --surface-2: #141A21; --surface-3: #222B35;
  --ink: #E2E7ED; --ink-2: #A2ADBA; --ink-3: #75818D; --line: #28313B; --line-2: #36414D;
  --accent: #8398FF; --accent-ink: #0D1431; --accent-soft: #212A4E; --accent-text: #A3B2FF;
  --crit: #FF6F64; --high: #EFA23B; --ok: #4CC184;
  --grid: rgba(131, 152, 255, .05);
  --shadow: 0 1px 0 rgba(0, 0, 0, .35); --shadow-lg: 0 18px 44px rgba(0, 0, 0, .55);
  --scrim: rgba(0, 0, 0, .58);
  color-scheme: dark;
}
:root[data-fb-theme="light"] { color-scheme: light; }

html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { height: 100%; background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--f-body); overflow: hidden; }
#app { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 15px; height: 15px; }
.icon.xs { width: 13px; height: 13px; }
[dir="rtl"] .flip { transform: scaleX(-1); }

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.danger { color: var(--crit); }
.btn.danger.solid { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.ibtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); flex: none; }
.ibtn:hover { background: var(--surface-3); color: var(--ink); }
.ibtn[disabled] { opacity: .35; cursor: default; background: transparent; }
.field { display: grid; gap: 6px; }
.label { font: 600 11.5px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.input, .select, .textarea { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); outline: none; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: vertical; line-height: 1.5; min-height: 80px; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-inline-end: 30px; }
[dir="rtl"] .select { background-position: 16px 55%, 11px 55%; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 30px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.switch { position: relative; width: 38px; height: 22px; border-radius: 99px; border: 0; background: var(--line-2); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { inset-inline-start: 19px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--surface-2); border-inline-end: 1px solid var(--line); padding: 16px 12px 12px; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand-name { font: 700 17px/1 var(--f-display); letter-spacing: -.01em; }
.brand-sub { font: 400 11px/1.2 var(--f-mono); color: var(--ink-2); margin-top: 3px; }
.nav { display: grid; gap: 2px; align-content: start; }
.nav a, .nav button.navlink { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; border: 0; background: transparent; text-align: start; width: 100%; }
.nav a:hover, .nav button.navlink:hover { background: var(--surface-3); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.nav .cnt { margin-inline-start: auto; font: 500 11px var(--f-mono); color: var(--ink-3); }
.side-sec { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 2px; }
.side-boards { overflow-y: auto; min-height: 0; flex: 1; margin-inline: -4px; padding-inline: 4px; }
.bdot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.side-foot { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.side-foot .row { display: flex; gap: 4px; align-items: center; }
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; height: 100%; }
.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.view.is-board { overflow: hidden; }
.pad { padding-left: var(--gut-l); padding-right: var(--gut-r); }
.wrap { max-width: 1180px; margin-inline: auto; padding-block: 28px 48px; }
.topbar, .bottomnav { display: none; }

@media (max-width: 999px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: flex; align-items: center; gap: 6px; min-height: 52px; padding-block: 6px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface-2); border-top: 1px solid var(--line); padding-block: 4px; }
  .bottomnav a, .bottomnav button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--ink-2); text-decoration: none; font-size: 11px; font-weight: 500; border: 0; background: transparent; }
  .bottomnav a[aria-current="page"] { color: var(--accent-text); }
  .bottomnav .fab { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); place-content: center; justify-self: center; align-self: center; padding: 0; }
  .wrap { padding-block: 18px 32px; }
}
.switcher { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; text-align: start; }
.switcher:hover { background: var(--surface-3); }
.switcher .t { font: 600 16px/1.2 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- page headers ---------- */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.ph h1 { font-size: 28px; font-weight: 700; letter-spacing: -.015em; line-height: 1.1; }
.ph .date { font: 400 12.5px var(--f-mono); color: var(--ink-2); margin-bottom: 6px; text-transform: capitalize; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.h2 { font: 600 15px/1.2 var(--f-display); display: flex; align-items: center; gap: 8px; }
.sec { margin-top: 28px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

/* ---------- home ---------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
@media (max-width: 1199px) { .home-grid { grid-template-columns: minmax(0, 1fr); } .home-grid .today { order: -1; } }
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.bcard { position: relative; display: grid; gap: 12px; align-content: start; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: start; color: inherit; text-decoration: none; min-width: 0; }
.bcard:hover { border-color: var(--line-2); }
.bcard .top { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.btile { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.btile.sm { width: 26px; height: 26px; border-radius: 7px; }
.btile.sm .icon { width: 15px; height: 15px; }
.bcard .name { font: 600 16px/1.25 var(--f-display); overflow-wrap: anywhere; }
.bcard .desc { color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.bcard .stats { display: flex; gap: 14px; font: 500 12px var(--f-mono); color: var(--ink-2); }
.bcard .stats b { color: var(--ink); font-weight: 500; font-size: 15px; }
.bar { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bcard .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-2); }
.bcard .menu-btn { position: absolute; top: 10px; inset-inline-end: 8px; }
.bcard.new { border-style: dashed; border-color: var(--line-2); background: transparent; box-shadow: none; place-content: center; justify-items: center; min-height: 168px; color: var(--ink-2); font-weight: 500; }
.bcard.new:hover { background: var(--surface); color: var(--ink); }
.today { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.today h2 { font-size: 15px; font-weight: 600; }
.tgroup { margin-top: 14px; }
.tgroup .label { margin-bottom: 6px; display: flex; justify-content: space-between; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
.trow:hover { background: var(--surface-2); }
.trow .tt { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .sub { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--ink-2); padding: 28px 12px; display: grid; gap: 10px; justify-items: center; }
.empty .icon { width: 28px; height: 28px; color: var(--ink-3); }
.notice { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); margin-bottom: 20px; }
.notice p { margin: 0; flex: 1 1 260px; }
.notice.warn { background: color-mix(in srgb, var(--high) 16%, var(--surface)); }

/* ---------- board ---------- */
.bview { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.bhead { display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; flex-wrap: wrap; }
.bhead .title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 260px; }
.bhead h1 { font-size: 21px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bhead .meta { font: 400 12px var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.bhead .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.filter { position: relative; display: flex; align-items: center; }
.filter .icon { position: absolute; inset-inline-start: 10px; color: var(--ink-3); pointer-events: none; }
.filter .input { padding-inline-start: 32px; min-height: 34px; width: 210px; }
.ctabs { display: none; }
.bscroll { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; border-top: 1px solid var(--line); }
.cols { display: flex; gap: 14px; height: 100%; width: max-content; padding-block: 16px 18px; align-items: flex-start; }
.col { width: var(--col-w); flex: none; display: flex; flex-direction: column; max-height: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-col); }
.col[data-drag-src] { opacity: .4; }
.col-head { display: flex; align-items: center; gap: 6px; padding: 9px 6px 7px 8px; }
.col-handle { display: grid; place-items: center; width: 22px; height: 26px; border-radius: 6px; color: var(--ink-3); cursor: grab; touch-action: none; border: 0; background: transparent; flex: none; }
.col-handle:hover { background: var(--surface-3); color: var(--ink); }
.col-kind { color: var(--ink-2); display: grid; place-items: center; }
.col-kind.done { color: var(--ok); }
.col-name { font: 600 14px/1.2 var(--f-display); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; border: 0; background: transparent; text-align: start; padding: 4px 2px; border-radius: 6px; }
.col-name-input { flex: 1; min-width: 0; font: 600 14px/1.2 var(--f-display); padding: 4px 6px; border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); outline: none; }
.col-count { font: 500 11.5px/1 var(--f-mono); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.col-default { font: 500 10.5px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
.col-body { flex: 1 1 auto; min-height: 56px; overflow-y: auto; padding: 4px 8px 6px; display: flex; flex-direction: column; gap: 8px; overflow-x: hidden; overscroll-behavior-y: contain; }
.col-foot { padding: 2px 8px 8px; }
.add-task { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 500; text-align: start; }
.add-task:hover { background: var(--surface-3); color: var(--ink); }
.quickadd { display: grid; gap: 8px; }
.quickadd textarea { min-height: 64px; resize: none; }
.quickadd .row { display: flex; gap: 6px; align-items: center; }
.quickadd .hint { font-size: 11.5px; color: var(--ink-2); margin-inline-start: auto; }
.add-col { width: var(--col-w); flex: none; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed var(--line-2); border-radius: var(--r-col); color: var(--ink-2); background: color-mix(in srgb, var(--surface-2) 60%, transparent); font-weight: 500; }
.add-col:hover { color: var(--ink); background: var(--surface-2); }
.col-empty { text-align: center; font-size: 12.5px; color: var(--ink-3); padding: 14px 6px; border: 1px dashed var(--line-2); border-radius: 8px; }

@media (max-width: 999px) {
  .bhead { padding-block: 10px 8px; }
  .bhead .title { display: none; }
  .bhead .tools { width: 100%; }
  .filter { flex: 1; }
  .filter .input { width: 100%; }
  .ctabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 0 8px; scrollbar-width: none; }
  .ctabs::-webkit-scrollbar { display: none; }
  .ctabs button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .ctabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .ctabs .num { font-size: 11px; opacity: .8; }
  .bscroll { scroll-snap-type: x mandatory; scroll-padding-inline: 16px; }
  .bscroll.dragging { scroll-snap-type: none; }
  :root { --col-w: min(84vw, 340px); }
  .col { scroll-snap-align: start; }
}

/* ---------- cards ---------- */
.card { position: relative; display: grid; gap: 8px; padding: 10px 10px 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; flex: none; }
.card:hover { border-color: var(--line-2); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.card[data-drag-src] { opacity: .35; }
.card.crit { border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.card .row1 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.card .ctitle { font-weight: 500; line-height: 1.38; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding-top: 1px; }
.card.done .ctitle { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--line-2); }
.card .cmenu { width: 26px; height: 26px; margin: -3px -4px -3px 0; opacity: 0; }
.card:hover .cmenu, .card:focus-within .cmenu, .card .cmenu[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .card .cmenu { opacity: .7; } }
.card .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding-inline-start: 26px; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; padding-inline-start: 26px; }
.check { width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; border: 1.6px solid var(--line-2); background: var(--surface); display: grid; place-items: center; padding: 0; color: transparent; flex: none; }
.check:hover { border-color: var(--accent); color: var(--accent); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check .icon { width: 12px; height: 12px; stroke-width: 3; }

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

const pad2 = n => String(n).padStart(2, '0');

};

// ---------- defaults & normalization ----------
const navLang = (() => { try { return (navigator.language || 'en').toLowerCase().startsWith('he') ? 'he' : 'en'; } catch (e) { return 'en'; } })();

function defaultSettings() {
  return {
    theme: 'system', language: navLang, dateFormat: 'regional', weekStart: navLang === 'he' ? 0 : 1,
    defaultPriority: 'medium', startView: 'home', reminders: true, dailyDigest: true, lastBackupAt: null, sampleDismissed: false,
  };
}
function emptyState() {
  return { version: 1, boards: [], columns: [], tasks: [], tags: [], activity: [], settings: defaultSettings() };
}

const str = (v, d = '') => (typeof v === 'string' ? v : d);
const arr = v => (Array.isArray(v) ? v : []);

function normalizeState(raw) {
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  s.settings = { ...s.settings, ...(raw.settings && typeof raw.settings === 'object' ? raw.settings : {}) };
  if (!['en', 'he'].includes(s.settings.language)) s.settings.language = 'en';
  if (!PRIORITIES.includes(s.settings.defaultPriority)) s.settings.defaultPriority = 'medium';
  s.boards = arr(raw.boards).filter(b => b && b.id).map((b, i) => ({
    id: String(b.id), name: str(b.name, 'Board'), description: str(b.description), color: str(b.color, SWATCHES[0]),
    icon: BOARD_ICONS.includes(b.icon) ? b.icon : 'grid', order: typeof b.order === 'number' ? b.order : i,
    createdAt: str(b.createdAt, nowISO()), updatedAt: str(b.updatedAt, nowISO()), sample: !!b.sample,
  }));
  const boardIds = new Set(s.boards.map(b => b.id));
  s.columns = arr(raw.columns).filter(c => c && c.id && boardIds.has(c.boardId)).map((c, i) => ({
    id: String(c.id), boardId: String(c.boardId), name: str(c.name, 'Column'), order: typeof c.order === 'number' ? c.order : i,
    kind: KINDS.includes(c.kind) ? c.kind : (c.isDone ? 'done' : 'todo'), isDefault: !!c.isDefault,
  }));
  // every board needs at least one column
  for (const b of s.boards) {
    if (!s.columns.some(c => c.boardId === b.id)) s.columns.push({ id: uid(), boardId: b.id, name: 'To Do', order: 0, kind: 'todo', isDefault: true });
  }
  s.tags = arr(raw.tags).filter(t => t && t.id).map(t => ({ id: String(t.id), name: str(t.name, 'Tag'), color: str(t.color, SWATCHES[7]), sample: !!t.sample }));
  const tagIds = new Set(s.tags.map(t => t.id));
  const colById = new Map(s.columns.map(c => [c.id, c]));
  s.tasks = arr(raw.tasks).filter(t => t && t.id && boardIds.has(t.boardId)).map((t, i) => {
    let columnId = String(t.columnId || '');
    const col = colById.get(columnId);
    if (!col || col.boardId !== t.boardId) columnId = defaultColumnIdFor(s.columns, t.boardId);
    return {
      id: String(t.id), boardId: String(t.boardId), columnId, order: typeof t.order === 'number' ? t.order : i,
      title: str(t.title, 'Untitled'), description: str(t.description), notes: str(t.notes),
      priority: PRIORITIES.includes(t.priority) ? t.priority : 'medium',
      dueDate: isValidYMD(t.dueDate) ? t.dueDate : null,
      tagIds: arr(t.tagIds).map(String).filter(id => tagIds.has(id)),
      checklist: arr(t.checklist).filter(c => c && typeof c.text === 'string').map(c => ({ id: String(c.id || uid()), text: c.text, done: !!c.done })),
      dependsOn: arr(t.dependsOn).map(String),
      recurrence: t.recurrence && ['daily', 'weekly', 'monthly', 'custom'].includes(t.recurrence.freq)
        ? { freq: t.recurrence.freq, interval: clamp(parseInt(t.recurrence.interval, 10) || 1, 1, 365), unit: ['day', 'week', 'month'].includes(t.recurrence.unit) ? t.recurrence.unit : 'day' } : null,
      reminders: arr(t.reminders).filter(r => r && r.at).map(r => ({ id: String(r.id || uid()), at: String(r.at), fired: !!r.fired })),
      archived: !!t.archived, archivedAt: t.archivedAt || null, completedAt: t.completedAt || null,
      createdAt: str(t.createdAt, nowISO()), updatedAt: str(t.updatedAt, nowISO()),
      focusMinutes: Math.max(0, Number(t.focusMinutes) || 0),
      focusNotes: arr(t.focusNotes).filter(n => n && n.text).map(n => ({ at: str(n.at, nowISO()), text: String(n.text) })),
      sample: !!t.sample,
    };
  });

  for (const t of s.tasks) t.dependsOn = t.dependsOn.filter(id => id !== t.id && taskIds.has(id));

}
const ACTIVITY_CAP = 6000;

// ---------- queries ----------
function colsOf(state, boardId) { return state.columns.filter(c => c.boardId === boardId).sort(byOrder); }
function defaultColumnIdFor(columns, boardId) {
  const cols = columns.filter(c => c.boardId === boardId).sort(byOrder);
  const def = cols.find(c => c.isDefault) || cols.find(c => c.kind !== 'done') || cols[0];
  return def ? def.id : null;
}
function doneColumnIdFor(columns, boardId) {
  const cols = columns.filter(c => c.boardId === boardId).sort(byOrder);
  const d = cols.find(c => c.kind === 'done');
  return d ? d.id : null;
}
function colMap(state) { return new Map(state.columns.map(c => [c.id, c])); }
function taskMap(state) { return new Map(state.tasks.map(t => [t.id, t])); }
function isTaskDone(cmap, task) { const c = cmap.get(task.columnId); return !!(c && c.kind === 'done'); }
function openBlockers(state, task, tmap, cmap) {
  tmap = tmap || taskMap(state); cmap = cmap || colMap(state);
  return task.dependsOn.map(id => tmap.get(id)).filter(d => d && !d.completedAt && !isTaskDone(cmap, d));
}
function dueState(task, done) {
  if (!task.dueDate || done) return task.dueDate ? 'done' : null;
  const d = diffDays(task.dueDate, todayYMD());
  if (d < 0) return 'over';
  if (d === 0) return 'today';
  return 'later';
}
function boardStats(state, boardId, cmap) {
  cmap = cmap || colMap(state);
  let active = 0, done = 0;
  for (const t of state.tasks) {
    if (t.boardId !== boardId || t.archived) continue;
    if (isTaskDone(cmap, t)) done++; else active++;
  }
  return { active, done, total: active + done };
}
function dependsTransitively(state, fromId, targetId, seen = new Set()) {
  if (fromId === targetId) return true;
  if (seen.has(fromId)) return false;
  seen.add(fromId);
  const t = state.tasks.find(x => x.id === fromId);
  return !!t && t.dependsOn.some(id => dependsTransitively(state, id, targetId, seen));
}

// ---------- mutation helpers (operate on immer drafts) ----------
function log(d, type, task, extra) {
  d.activity.push({ id: uid(), at: nowISO(), type, taskId: task && task.id, boardId: task && task.boardId, title: task && task.title, priority: task && task.priority, ...(extra || {}) });

const JSPDF_SRC = PWA ? 'vendor/jspdf.umd.min.js' : 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
async function exportPDF(boardId) {
  const s = store.state, b = s.boards.find(x => x.id === boardId); if (!b) return;
  ui.toast(t('toast.pdfPreparing'));
  try { await loadScript(JSPDF_SRC); } catch (e) { ui.toast(t('toast.pdfFailed')); return; }
  try { await document.fonts.ready; } catch (e) {}
  const W = 1190, H = 1684, M = 84, rtl = getLang() === 'he';
  const pages = []; let ctx, y;
  const ink = '#17202A', ink2 = '#4B5765', line = '#CBD4CF', accent = '#2C47C9';
  const newPage = () => {
    const c = document.createElement('canvas'); c.width = W; c.height = H; pages.push(c);
    ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.direction = rtl ? 'rtl' : 'ltr'; ctx.textAlign = rtl ? 'right' : 'left'; ctx.textBaseline = 'alphabetic';
    y = M;
    ctx.font = '400 17px "IBM Plex Mono", monospace'; ctx.fillStyle = ink2;
    ctx.fillText(t('pdf.footer', { name: b.name, n: pages.length }), X(0), H - 48);
  };
  const X = dx => (rtl ? W - M - dx : M + dx);
  const wrap = (text, maxW) => {
    const words = String(text).split(/\s+/), lines = []; let cur = '';
    for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
    if (cur) lines.push(cur);
    return lines;
  };
  const need = hgt => { if (y + hgt > H - 100) newPage(); };
  newPage();
  const cmap = colMap(s), st = boardStats(s, boardId, cmap), tg = new Map(s.tags.map(x => [x.id, x]));
  ctx.fillStyle = accent; ctx.fillRect(rtl ? W - M - 60 : M, y - 10, 60, 6); y += 44;
  ctx.fillStyle = ink; ctx.font = '700 44px Rubik, "IBM Plex Sans Hebrew", sans-serif';
  for (const l of wrap(b.name, W - 2 * M)) { ctx.fillText(l, X(0), y); y += 54; }
  ctx.font = '400 20px "IBM Plex Mono", monospace'; ctx.fillStyle = ink2;
  ctx.fillText(t('pdf.sub', { date: fmtDate(todayYMD(), true), active: st.active, done: st.done }), X(0), y + 4); y += 30;
  if (b.description) { ctx.font = '400 21px "IBM Plex Sans", "IBM Plex Sans Hebrew", sans-serif'; for (const l of wrap(b.description, W - 2 * M)) { y += 30; ctx.fillText(l, X(0), y); } }
  y += 34; ctx.fillStyle = line; ctx.fillRect(M, y, W - 2 * M, 2); y += 46;
  for (const col of colsOf(s, boardId)) {
    const tasks = s.tasks.filter(x => x.columnId === col.id && !x.archived).sort(byOrder);
    need(90);
    ctx.fillStyle = ink; ctx.font = '600 28px Rubik, "IBM Plex Sans Hebrew", sans-serif';
    ctx.fillText(col.name, X(0), y);
    const nameW = ctx.measureText(col.name).width;
    ctx.font = '500 19px "IBM Plex Mono", monospace'; ctx.fillStyle = ink2;
    ctx.fillText('(' + tasks.length + ')', X(nameW + 12), y);
    y += 24;
    if (!tasks.length) { y += 20; ctx.font = 'italic 400 19px "IBM Plex Sans", "IBM Plex Sans Hebrew", sans-serif'; ctx.fillText(t('pdf.empty'), X(0), y); y += 22; }
    for (const x of tasks) {
      ctx.font = '500 22px "IBM Plex Sans", "IBM Plex Sans Hebrew", sans-serif';
      const lines = wrap(x.title, W - 2 * M - 44);
      const meta = [t('prio.' + x.priority)];
      if (x.dueDate) meta.push(t('pdf.due', { date: fmtDate(x.dueDate, true) }));
      if (x.checklist.length) meta.push(t('pdf.checklist', { a: x.checklist.filter(c => c.done).length, b: x.checklist.length }));
      if (x.tagIds.length) meta.push(x.tagIds.map(id => tg.get(id) && tg.get(id).name).filter(Boolean).join(', '));
      need(26 + lines.length * 30 + 30);
      y += 30;
      const done = col.kind === 'done';
      ctx.strokeStyle = done ? accent : ink2; ctx.lineWidth = 2;
      const bx = rtl ? W - M - 20 : M;
      ctx.beginPath(); ctx.rect(bx, y - 17, 20, 20); ctx.stroke();
      if (done) { ctx.fillStyle = accent; ctx.fillRect(bx + 4, y - 13, 12, 12); }
      ctx.fillStyle = ink; ctx.font = '500 22px "IBM Plex Sans", "IBM Plex Sans Hebrew", sans-serif';
      lines.forEach((l, i) => ctx.fillText(l, X(36), y + i * 30));
      y += (lines.length - 1) * 30 + 27;
      ctx.font = '400 17.5px "IBM Plex Sans", "IBM Plex Sans Hebrew", sans-serif'; ctx.fillStyle = ink2;
      for (const ml of wrap(meta.join('  ·  '), W - 2 * M - 44)) { ctx.fillText(ml, X(36), y); y += 24; }
      y -= 6;
    }
    y += 52;
  }
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
    pages.forEach((c, i) => { if (i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 595.28, 841.89); });
    await saveFile(`${slug(b.name)}-${fileStamp()}.pdf`, pdf.output('arraybuffer'));
  } catch (e) { ui.toast(t('toast.pdfFailed')); }
}

// ---------- statistics ----------
function StatsView({ state }) {
  const cmap = useMemo(() => colMap(state), [state.columns]);
  const today = todayYMD();
  const completions = useMemo(() => {
    const m = new Map();
    for (const a of state.activity) if (a.type === 'completed') { const k = isoToYMD(a.at); m.set(k, (m.get(k) || 0) + 1); }
    return m;
  }, [state.activity]);
  const cnt = k => completions.get(k) || 0;
  const ws = weekStartOf(today);
  const week = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const thisWeek = week.reduce((s, k) => s + (k <= today ? cnt(k) : 0), 0);
  let last30 = 0; for (let i = 0; i < 30; i++) last30 += cnt(addDays(today, -i));
  const open = state.tasks.filter(x => !x.archived && !isTaskDone(cmap, x));
  const inProgress = open.filter(x => (cmap.get(x.columnId) || {}).kind === 'doing').length;
  const overdue = open.filter(x => x.dueDate && x.dueDate < today).length;
  const created30 = state.tasks.filter(x => diffDays(today, isoToYMD(x.createdAt)) < 30);
  const rate = created30.length ? Math.round(created30.filter(x => x.completedAt).length / created30.length * 100) : null;
  let streak = 0; { let d = cnt(today) ? today : addDays(today, -1); while (cnt(d)) { streak++; d = addDays(d, -1); } }
  const focusMin = state.tasks.reduce((s, x) => s + x.focusMinutes, 0);
  const kpis = [
    [cnt(today), t('stats.today')], [thisWeek, t('stats.week')], [inProgress, t('stats.inProgress')], [overdue, t('stats.overdue')],
    [(last30 / 30).toFixed(1), t('stats.avg')], [rate == null ? '—' : rate + '%', t('stats.rate')],
  ];
  return html`<div class="pad"><div class="wrap">
    <div class="ph"><div><h1>${t('nav.stats')}</h1><div class="muted" style="margin-top:6px">${streak > 1 ? t('stats.streak', { n: streak }) : thisWeek ? t('stats.weekLine', { n: thisWeek }) : t('stats.calm')}</div></div></div>
    <div class="kpis">${kpis.map(([v, k]) => html`<div class="kpi" key=${k}><div class="v">${v}</div><div class="k">${k}</div></div>`)}</div>
    <div class="charts">
      <section class="panel"><h2>${t('stats.weekChart')}</h2><div class="sub">${t('stats.weekChartSub', { from: fmtDate(week[0]), to: fmtDate(week[6]) })}</div><${WeekBars} week=${week} cnt=${cnt} today=${today} /></section>
      <section class="panel"><h2>${t('stats.byPriority')}</h2><div class="sub">${t('stats.openOnly', { n: open.length })}</div>
        <div class="hbars">${(() => { const max = Math.max(1, ...PRIORITIES.map(p => open.filter(x => x.priority === p).length)); return PRIORITIES.map(p => { const v = open.filter(x => x.priority === p).length; return html`<div class="hbar" key=${p}><span class="lab"><${Prio} p=${p} />${t('prio.' + p)}</span><span class="trk"><i style=${'width:' + (v / max * 100) + '%'}></i></span><span class="val">${v}</span></div>`; }); })()}</div></section>
      <section class="panel"><h2>${t('stats.heat')}</h2><div class="sub">${t('stats.heatSub', { n: (() => { let s = 0; completions.forEach(v => { s += v; }); return s; })() })}</div><${Heatmap} cnt=${cnt} today=${today} /></section>
      <section class="panel"><h2>${t('stats.byBoard')}</h2><div class="sub">${t('stats.byBoardSub')}</div>
        <div class="hbars">${(() => { const rows = [...state.boards].sort(byOrder).map(b => ({ b, ...boardStats(state, b.id, cmap) })); const max = Math.max(1, ...rows.map(r => r.active)); return rows.length ? rows.map(r => html`<div class="hbar" key=${r.b.id}><span class="lab"><span class="bdot" style=${'background:' + r.b.color}></span><span style="overflow:hidden;text-overflow:ellipsis">${r.b.name}</span></span><span class="trk"><i style=${'width:' + (r.active / max * 100) + '%'}></i></span><span class="val">${r.active}<span class="muted" style="font-size:11px">/${r.total}</span></span></div>`) : html`<div class="muted">${t('home.noBoards')}</div>`; })()}</div></section>
    </div>
    ${focusMin > 0 && html`<p class="muted" style="margin-top:18px">${t('stats.focusTotal', { h: Math.floor(focusMin / 60), m: focusMin % 60 })}</p>`}
  </div></div>`;
}
function WeekBars({ week, cnt, today }) {
  const W = 560, H = 200, top = 22, bottom = 30, left = 28, right = 8, ph = H - top - bottom;
  const vals = week.map(k => cnt(k));
  const max = Math.max(4, ...vals);
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : 10;
  const ymax = Math.ceil(max / step) * step;
  const ticks = []; for (let v = 0; v <= ymax; v += step) ticks.push(v);
  const rtl = getLang() === 'he';
  const slot = (W - left - right) / 7, bw = Math.min(42, slot * .58);
  const best = Math.max(...vals);
  return html`<svg class="chart-svg" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${t('stats.weekChart')}>
    ${ticks.map(v => { const y = top + ph - v / ymax * ph; return html`<g key=${v}><line class="gridl" x1=${rtl ? 0 : left} x2=${rtl ? W - left : W} y1=${y} y2=${y} /><text x=${rtl ? W - 4 : left - 8} y=${y + 4} text-anchor="end" style=${rtl ? 'text-anchor:start' : ''}>${v}</text></g>`; })}
    ${week.map((k, i) => {
      const idx = rtl ? 6 - i : i;
      const cx = (rtl ? 0 : left) + slot * idx + slot / 2, v = vals[i], hgt = v / ymax * ph, x = cx - bw / 2, y = top + ph - hgt;
      const future = k > today, isToday = k === today;
      const r = Math.min(4, hgt);
      const path = hgt > 0 ? `M${x},${top + ph} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${top + ph} Z` : '';
      const label = `${cap(parseYMD(k).toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'short' }))}: ${t('stats.nDone', { n: v })}`;
      return html`<g key=${k}>
        <rect class="hit" x=${cx - slot / 2} y=${top} width=${slot} height=${ph} tabindex="0" aria-label=${label} onMouseEnter=${e => showTip(e, label)} onMouseLeave=${hideTip} onFocus=${e => showTip(e, label)} onBlur=${hideTip} />
        ${path && html`<path class=${'bar-m' + (future ? ' future' : '')} d=${path} />`}
        ${hgt === 0 && !future && html`<rect x=${x} y=${top + ph - 2} width=${bw} height="2" rx="1" fill="var(--line-2)" />`}
        ${(isToday || (v === best && v > 0)) && v > 0 && html`<text x=${cx} y=${y - 6} text-anchor="middle" style="fill:var(--ink)">${v}</text>`}
        <text x=${cx} y=${H - 10} text-anchor="middle" style=${isToday ? 'fill:var(--ink);font-weight:600' : ''}>${weekdayShort(parseYMD(k))}</text>
      </g>`;
    })}
  </svg>`;
}
function Heatmap({ cnt, today }) {
  const weeks = 26;
  const start = addDays(weekStartOf(today), -7 * (weeks - 1));
  const cells = []; let max = 0;
  for (let i = 0; i < weeks * 7; i++) { const k = addDays(start, i); const v = k <= today ? cnt(k) : 0; if (v > max) max = v; cells.push(k); }
  const lvl = v => (v === 0 ? 0 : Math.min(4, Math.ceil(v / Math.max(1, max) * 4)));
  const out = [];
  for (let w = 0; w < weeks; w++) {
    const first = cells[w * 7];
    const prev = w ? cells[(w - 1) * 7] : null;
    const showMonth = !prev || parseYMD(first).getMonth() !== parseYMD(prev).getMonth();
    out.push(html`<span class="m" key=${'m' + w} style=${'grid-column:' + (w + 1)}>${showMonth && w < weeks - 1 ? parseYMD(first).toLocaleDateString(locale(), { month: 'short' }) : ''}</span>`);
    for (let d = 0; d < 7; d++) {
      const k = cells[w * 7 + d], v = cnt(k), fut = k > today;
      const label = `${fmtDate(k, true)}: ${t('stats.nDone', { n: v })}`;
      out.push(html`<span key=${k} class=${'c' + (fut ? ' out' : '')} data-l=${fut ? 0 : lvl(v)} style=${`grid-column:${w + 1};grid-row:${d + 2}`} tabindex=${fut ? null : '-1'} aria-label=${label} onMouseEnter=${fut ? null : e => showTip(e, label)} onMouseLeave=${hideTip}></span>`);
    }
  }
  return html`<div>
    <div class="heat-wrap"><div class="heat" role="img" aria-label=${t('stats.heat')}>${out}</div></div>
    <div class="heat-legend">${t('stats.less')}${[0, 1, 2, 3, 4].map(l => html`<span class="c" data-l=${l} style=${l ? '' : 'background:var(--surface-2)'}></span>`)}${t('stats.more')}</div>
  </div>`;
}

// ---------- menu ----------
function Menu({ menu }) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ left: -9999, top: -9999 });
  const items = typeof menu.items === 'function' ? menu.items() : menu.items;
  useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    const r = menu.rect, w = el.offsetWidth, hgt = el.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    const rtl = document.documentElement.dir === 'rtl';
    let left = rtl ? r.left : r.right - w;
    left = clamp(left, 8, vw - w - 8);
    let top = r.bottom + 6;
    if (top + hgt > vh - 8) top = Math.max(8, r.top - hgt - 6);
    setPos({ left, top });
  }, [menu.key]);
  useEffect(() => {
    const first = ref.current && ref.current.querySelector('.mi:not([disabled])');
    first && first.focus({ preventScroll: true });
    const onDown = e => { if (ref.current && !ref.current.contains(e.target) && !(menu.anchor && menu.anchor.contains(e.target))) ui.closeMenu(); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); ui.closeMenu(); menu.anchor && menu.anchor.focus && menu.anchor.focus(); }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const els = [...ref.current.querySelectorAll('.mi:not([disabled])')];
        const i = els.indexOf(document.activeElement);
        const n = els[(i + (e.key === 'ArrowDown' ? 1 : -1) + els.length) % els.length]; n && n.focus();
      }
    };
    const onResize = () => ui.closeMenu();
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', onResize);
    return () => { document.removeEventListener('pointerdown', onDown, true); document.removeEventListener('keydown', onKey, true); window.removeEventListener('resize', onResize); };
  }, [menu.key]);
  return html`<div class="menu" role="menu" ref=${ref} style=${`left:${pos.left}px;top:${pos.top}px`}>
    ${items.map((it, i) => it.divider ? html`<hr key=${'d' + i} />` : it.header ? html`<div class="mh" key=${'h' + i}>${it.header}</div>` : html`<button key=${'i' + i} class=${'mi' + (it.danger ? ' danger' : '')} role=${it.checked != null ? 'menuitemcheckbox' : 'menuitem'} aria-checked=${it.checked != null ? String(!!it.checked) : null} disabled=${it.disabled}
      onClick=${() => { if (it.disabled) return; if (it.keep || menu.keep) { it.fn && it.fn(); ui.set({ menu: { ...menu } }); } else { ui.closeMenu(); it.fn && it.fn(); } }}>
      ${it.dot ? html`<span class="dot" style=${'background:' + it.dot}></span>` : it.prio ? html`<${Prio} p=${it.prio} />` : it.icon ? html`<${Icon} n=${it.icon} cls="sm" flip=${it.flip} />` : null}
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.label}</span>
      ${it.checked && html`<span class="ck"><${Icon} n="check" cls="sm" /></span>`}
    </button>`)}
  </div>`;
}

// ---------- modal base ----------
function Modal({ title, children, footer, wide, onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const el = ref.current && (ref.current.querySelector('[data-autofocus]') || ref.current.querySelector('input, textarea, select, button.primary'));
    el && el.focus();
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); onClose(); }
      if (e.key === 'Tab' && ref.current) {
        const f = [...ref.current.querySelectorAll('button:not([disabled]), input, textarea, select, [tabindex="0"]')].filter(x => x.offsetParent !== null);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    return () => { document.removeEventListener('keydown', onKey, true); prev && prev.focus && prev.isConnected && prev.focus({ preventScroll: true }); };
  }, []);
  return html`<div class="modal-wrap" onPointerDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div class=${'modal' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-labelledby="modal-title" ref=${ref}>
      <div class="modal-h"><h2 id="modal-title">${title}</h2><button class="ibtn" aria-label=${t('btn.close')} onClick=${onClose}><${Icon} n="x" /></button></div>
      <div class="modal-b">${children}</div>
      ${footer && html`<div class="modal-f">${footer}</div>`}
    </div>
  </div>`;
}

function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [[660, 0], [880, .22], [990, .44]].forEach(([f, d]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0, ac.currentTime + d); g.gain.linearRampToValueAtTime(.18, ac.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d + .5);
      o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + .55);
    });
    setTimeout(() => ac.close(), 1400);
  } catch (e) {}
}
function FocusMode({ taskId, state }) {
  const task = state.tasks.find(x => x.id === taskId);
  const [dur, setDur] = useState(25 * 60);
  const [left, setLeft] = useState(25 * 60);
  const [running, setRunning] = useState(false);
  const [note, setNote] = useState('');
  const tick = useRef({ endAt: 0, logged: 0, wake: null });
  useEffect(() => {
    if (!running) return;
    tick.current.endAt = Date.now() + left * 1000;
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { tick.current.wake = l; }).catch(() => {}); } catch (e) {}
    const iv = setInterval(() => {
      const rem = Math.max(0, Math.round((tick.current.endAt - Date.now()) / 1000));
      setLeft(rem);
      if (rem === 0) {
        clearInterval(iv); setRunning(false); chime();
        const mins = Math.round((dur - tick.current.logged) / 60); tick.current.logged = dur;
        A.logFocus(taskId, mins);
        ui.toast(t('focus.doneToast', { m: Math.round(dur / 60) }));
      }
    }, 250);
    return () => { clearInterval(iv); if (tick.current.wake) { tick.current.wake.release().catch(() => {}); tick.current.wake = null; } };
  }, [running]);
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape' && !document.querySelector('.modal-wrap, .menu')) { e.stopPropagation(); exit(); } };
    document.addEventListener('keydown', onKey, true);
    return () => document.removeEventListener('keydown', onKey, true);
  });
  const logPartial = () => { const spent = dur - left - tick.current.logged; if (spent >= 60) { A.logFocus(taskId, Math.floor(spent / 60)); tick.current.logged += Math.floor(spent / 60) * 60; } };
  const exit = () => { logPartial(); ui.set({ focusId: null }); };
  if (!task) return null;
  const preset = m => { if (running) return; logPartial(); tick.current.logged = 0; setDur(m * 60); setLeft(m * 60); };
  const reset = () => { logPartial(); setRunning(false); tick.current.logged = 0; setLeft(dur); };
  const R = 52, C = 2 * Math.PI * R, frac = dur ? left / dur : 0;
  const board = state.boards.find(b => b.id === task.boardId);
  const cmap = colMap(state), done = isTaskDone(cmap, task);
  const clDone = task.checklist.filter(c => c.done).length;
  return html`<div class="focus" role="dialog" aria-modal="true" aria-label=${t('focus.title')}>
    <div class="focus-in pad">
      <div class="focus-top"><span class="eyebrow"><${Icon} n="target" cls="sm" />${t('focus.title')} · ${board && board.name}</span><button class="btn sm" onClick=${exit}><${Icon} n="back" cls="sm" flip />${t('focus.back')}</button></div>
      <h1>${task.title}</h1>
      <div class="timer">
        <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r=${R} fill="none" stroke-width="7" /><circle class="val" cx="60" cy="60" r=${R} fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C * (1 - frac)} /></svg>
          <div class="clock"><div class="tm" role="timer" aria-live="off">${pad2(Math.floor(left / 60))}:${pad2(left % 60)}</div><div class="st">${running ? t('focus.running') : left === 0 ? t('focus.finished') : left === dur ? t('focus.ready') : t('focus.paused')}</div></div></div>
        <div class="ctl">
          <button class="btn primary" style="min-width:120px" onClick=${() => { if (left === 0) { tick.current.logged = 0; setLeft(dur); setRunning(true); } else { if (running) logPartial(); setRunning(!running); } }}><${Icon} n=${running ? 'pause' : 'play'} />${running ? t('focus.pause') : left === 0 ? t('focus.again') : left === dur ? t('focus.start') : t('focus.resume')}</button>
          <button class="btn" onClick=${reset} disabled=${left === dur && !running}><${Icon} n="restore" />${t('focus.reset')}</button>
        </div>
        <div class="seg" role="group" aria-label=${t('focus.length')}>${[15, 25, 50].map(m => html`<button key=${m} aria-pressed=${dur === m * 60 ? 'true' : 'false'} disabled=${running} onClick=${() => preset(m)}>${t('focus.min', { m })}</button>`)}</div>
      </div>
      ${task.description && html`<div class="card-like"><span class="label">${t('task.description')}</span><p class="desc">${task.description}</p></div>`}
      ${task.checklist.length > 0 && html`<div class="card-like"><div class="dsec-h"><span class="label">${t('task.checklist')}</span><span class="num muted" style="font-size:12px">${clDone}/${task.checklist.length}</span></div>
        ${task.checklist.map(it => html`<label key=${it.id} style="display:flex;gap:10px;align-items:center;cursor:pointer"><button class="cb" role="checkbox" aria-checked=${it.done ? 'true' : 'false'} onClick=${() => A.toggleItem(task.id, it.id)}><${Icon} n="check" /></button><span style=${it.done ? 'color:var(--ink-2);text-decoration:line-through' : ''}>${it.text}</span></label>`)}</div>`}
      <form class="card-like" onSubmit=${e => { e.preventDefault(); if (note.trim()) { A.addFocusNote(task.id, note); setNote(''); ui.toast(t('focus.noteSaved')); } }}>
        <label class="label" for="focus-note">${t('focus.note')}</label>
        <textarea id="focus-note" class="textarea" style="min-height:70px" placeholder=${t('focus.notePh')} value=${note} onInput=${e => setNote(e.target.value)}></textarea>
        <div class="inline"><button class="btn sm" type="submit" disabled=${!note.trim()}>${t('focus.saveNote')}</button>${task.focusNotes.length > 0 && html`<span class="muted" style="font-size:12px">${t('focus.notesCount', { n: task.focusNotes.length })}</span>`}</div>
      </form>
      <div class="inline" style="justify-content:center">
        ${!done && html`<button class="btn primary" onClick=${() => { A.toggleComplete(task.id); exit(); }}><${Icon} n="check" />${t('focus.complete')}</button>`}
        <button class="btn" onClick=${exit}>${t('focus.back')}</button>
      </div>
    </div>
  </div>`;
}

      if (e.target.closest && e.target.closest('[data-task]') && ['c', 'f', 'a', 'Delete', 'Backspace', 'Enter', ' '].includes(e.key)) return;
      const r = routeRef.current;
      const k = e.key.toLowerCase();
      if (k === 'n' || k === 'q') { e.preventDefault(); ui.dialog({ type: 'capture', boardId: r.view === 'board' ? r.id : null }); }
      else if (k === 'b') { e.preventDefault(); ui.dialog({ type: 'board' }); }
      else if (e.key === '/') { e.preventDefault(); navigate('#search'); setTimeout(() => { const el = document.getElementById('search-q'); el && el.focus(); }, 40); }
      else if (k === 'h') navigate('#home');
      else if (e.key === '?') ui.dialog({ type: 'shortcuts' });
      else if (/^[1-9]$/.test(e.key)) { const b = [...store.state.boards].sort(byOrder)[Number(e.key) - 1]; if (b) navigate('#b-' + b.id); }
    };
    document.addEventListener('keydown', on);
    return () => document.removeEventListener('keydown', on);
  }, []);

  // local reminders, checked while the app is open
  useEffect(() => {
    let busy = false;
    const check = async () => {
      const s = store.state; if (!s.settings.reminders || busy) return;
      const now = Date.now(), due = [];
      for (const x of s.tasks) { if (x.archived) continue; for (const r of x.reminders) if (!r.fired && new Date(r.at).getTime() <= now) due.push([x, r]); }
      if (!due.length) return;
      busy = true;
      try {
        // the service worker may already have shown some of these while the app was closed
        const already = PWA ? await swNotifiedIds() : new Set();
        store.commit('reminder', d => { for (const [x, r] of due) { const tt = d.tasks.find(k => k.id === x.id); const rr = tt && tt.reminders.find(k => k.id === r.id); if (rr) rr.fired = true; } }, { noHistory: true });
        const fresh = due.filter(([, r]) => !already.has(r.id));
        const away = document.visibilityState !== 'visible';
        for (const [x, r] of fresh.slice(0, 3)) {
          ui.toast(t('toast.reminder', { name: x.title }), { action: { label: t('btn.open'), fn: () => ui.openTask(x.id) }, timeout: 12000 });
          if (away || !PWA) showSystemNotification(x.title, t('sw.reminder'), { task: x.id, tag: 'r-' + r.id });
        }
        if (PWA) await markNotified(fresh.map(([, r]) => r.id));
      } finally { busy = false; }
    };
    const onVis = () => { if (document.visibilityState === 'visible') check(); };
    document.addEventListener('visibilitychange', onVis);
    const first = setTimeout(check, 1500);
    const iv = setInterval(check, 20000);
    let day = todayYMD();
    const dayIv = setInterval(() => { if (todayYMD() !== day) { day = todayYMD(); store.emit(); } }, 60000);
    return () => { clearTimeout(first); clearInterval(iv); clearInterval(dayIv); document.removeEventListener('visibilitychange', onVis); };
  }, []);

  let view;
  if (route.view === 'board') view = html`<${BoardView} state=${state} boardId=${route.id} addingColumn=${u.addingColumn} />`;
  else if (route.view === 'search') view = html`<${SearchView} state=${state} />`;
  else if (route.view === 'stats') view = html`<${StatsView} state=${state} />`;
  else if (route.view === 'archive') view = html`<${ArchiveView} state=${state} />`;
  else if (route.view === 'prefs') view = html`<${SettingsView} state=${state} />`;
  else view = html`<${HomeView} state=${state} />`;

  return html`<div class="shell">
      <${Sidebar} state=${state} route=${route} />
      <main class="main">
        <${TopBar} state=${state} route=${route} />
        <div class=${'view' + (route.view === 'board' ? ' is-board' : '')} key=${route.view === 'board' ? 'board' : route.view}>${view}</div>
        <${BottomNav} route=${route} />
      </main>
    </div>
    ${u.taskId && html`<${TaskDrawer} key=${u.taskId} taskId=${u.taskId} state=${state} />`}
    ${u.focusId && html`<${FocusMode} taskId=${u.focusId} state=${state} />`}
    ${u.dialog && html`<${Dialogs} dialog=${u.dialog} state=${state} />`}
    ${u.menu && html`<${Menu} menu=${u.menu} />`}
    <${Toasts} toasts=${u.toasts} />`;
}

// ---------- boot ----------
store.init();
initPWA();
getDownloads();
(() => {
  const s = store.state.settings;
  if (!location.hash && s.startView !== 'home' && store.state.boards.some(b => b.id === s.startView)) {
    try { location.replace('#b-' + s.startView); } catch (e) {}
  }
})();
render(html`<${App} />`, document.getElementById('app'));
handleLaunchParams();

</script>
</body>
</html>
